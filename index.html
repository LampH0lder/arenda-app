<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Риелти</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=30">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="backBtn" class="back-btn hidden" aria-label="Назад">‹</button>
      <div class="tb-head">
        <div class="tb-title" id="tbTitle">Риелти</div>
        <div class="tb-sub" id="tbSub"></div>
      </div>
    </header>

    <main id="view"><div class="loader"><div class="spin"></div></div></main>

    <nav id="tabbar">
      <button class="tab active" data-tab="home">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5h4v5"/></svg></span><span>Главная</span>
      </button>
      <button class="tab" data-tab="fdg">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M5 15v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg></span><span>ФДГ</span>
      </button>
      <button class="tab" data-tab="clients">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.4-5.6 5.5-5.6s5.5 2.3 5.5 5.6"/><path d="M16 5.1a3.2 3.2 0 0 1 0 5.8"/><path d="M17.6 14.8c2 .7 3.4 2.7 3.4 5.2"/></svg></span><span>Клиенты</span>
      </button>
      <button class="tab" data-tab="listings">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="1.3"/><path d="M9 8h1.5M13.5 8H15M9 12h1.5M13.5 12H15M10.5 20v-3.2h3V20"/></svg></span><span>Объекты</span>
      </button>
      <button class="tab" data-tab="profile">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/></svg></span><span>Профиль</span>
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="onb" class="hidden"></div>

  <script src="app.js?v=53"></script>
</body>
</html>
