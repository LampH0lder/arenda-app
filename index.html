<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Риелти</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=24">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="backBtn" class="back-btn hidden" aria-label="Назад">‹</button>
      <div class="tb-head">
        <div class="tb-title" id="tbTitle">Риелти</div>
        <div class="tb-sub" id="tbSub"></div>
      </div>
    </header>

    <main id="view"><div class="loader"><div class="spin"></div></div></main>

    <nav id="tabbar">
      <button class="tab active" data-tab="home">
        <span class="ic">◎</span><span>Главная</span>
      </button>
      <button class="tab" data-tab="fdg">
        <span class="ic">⇪</span><span>ФДГ</span>
      </button>
      <button class="tab" data-tab="clients">
        <span class="ic">&#9786;&#65038;</span><span>Клиенты</span>
      </button>
      <button class="tab" data-tab="listings">
        <span class="ic">⌂</span><span>Объекты</span>
      </button>
      <button class="tab" data-tab="profile">
        <span class="ic">⚙</span><span>Профиль</span>
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=34"></script>
</body>
</html>
